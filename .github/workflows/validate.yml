name: Validate Creator OS
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest
      - run: python -m compileall -q app.py core tests
      - run: PYTHONPATH=. pytest -q
      - run: python -c "from core.video import parse_segments; from core.automation import choose_moments; from core.planners import plan_story, plan_transformation; from core.packaging import make_packaging; assert len(parse_segments('1,3,clip')) == 1; assert choose_moments(60, [], [], 2, 15); assert 'TRANSFORMATION PLAN' in plan_transformation('restore a chair','Short'); assert 'STORY-TO-VIDEO PLAN' in plan_story('a lost dog finds home','Cinematic'); assert 'TITLE' in make_packaging('a satisfying restoration'); print('Creator OS smoke checks passed')"
